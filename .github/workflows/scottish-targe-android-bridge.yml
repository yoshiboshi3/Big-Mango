name: Scottish Targe Android Bridge

on:
  push:
    branches: [ "scottish-targe-proof" ]
    paths:
      - "android-bridge/**"
      - ".github/workflows/scottish-targe-android-bridge.yml"
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run bridge unit tests
        id: bridge_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p android-bridge :bridge:testDebugUnitTest --stacktrace 2>&1 | tee bridge-test.log
          status=${PIPESTATUS[0]}
          echo '## Gradle diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -120 bridge-test.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Scottish-Targe-gradle-diagnostic
          path: bridge-test.log
          if-no-files-found: error

      - name: Stop if bridge tests failed
        if: steps.bridge_tests.outcome == 'failure'
        run: exit 1

      - name: Build bridge AAR
        run: gradle -p android-bridge :bridge:assembleDebug --stacktrace

      - name: Build Samsung feasibility APK
        run: gradle -p android-bridge :app:assembleDebug --stacktrace

      - name: Upload bridge AAR
        uses: actions/upload-artifact@v4
        with:
          name: Scottish-Targe-bridge-debug
          path: android-bridge/bridge/build/outputs/aar/bridge-debug.aar
          if-no-files-found: error

      - name: Upload Samsung feasibility APK
        uses: actions/upload-artifact@v4
        with:
          name: Scottish-Targe-Samsung-Gate-debug
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
