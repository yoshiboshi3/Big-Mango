name: Scottish Targe Android Bridge

on:
  push:
    branches: [ "scottish-targe-proof" ]
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Expand bridge source snapshot
        run: unzip -o scottish-targe/android-bridge-ci.zip -d .

      - name: Enable AndroidX
        run: echo 'android.useAndroidX=true' > android-bridge/gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run bridge unit tests
        run: gradle -p android-bridge :bridge:testDebugUnitTest --stacktrace

      - name: Build bridge AAR
        run: gradle -p android-bridge :bridge:assembleDebug --stacktrace

      - name: Upload bridge AAR
        uses: actions/upload-artifact@v4
        with:
          name: Scottish-Targe-bridge-debug
          path: android-bridge/bridge/build/outputs/aar/bridge-debug.aar
          if-no-files-found: error
