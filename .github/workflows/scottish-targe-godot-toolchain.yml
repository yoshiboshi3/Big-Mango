name: Scottish Targe Godot Toolchain

on:
  push:
    branches: ["scottish-targe-proof"]
    paths:
      - ".github/workflows/scottish-targe-godot-toolchain.yml"
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest"

      - name: Download Godot 4.7 stable and Android export templates
        run: |
          set -euxo pipefail
          curl -L --retry 4 --fail -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          sudo mv Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

          curl -L --retry 4 --fail -o templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.stable"
          unzip -q templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.stable/"

      - name: Configure Godot Android editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Warm the Godot Gradle build cache
        run: |
          set -euxo pipefail
          mkdir -p /tmp/godot-warm
          cat > /tmp/godot-warm/project.godot <<'EOF'
          [application]
          config/name="Scottish Targe Toolchain Warmup"
          run/main_scene="res://main.tscn"
          [display]
          window/size/viewport_width=64
          window/size/viewport_height=64
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cat > /tmp/godot-warm/main.tscn <<'EOF'
          [gd_scene format=3]
          [node name="Main" type="Node"]
          EOF
          cat > /tmp/godot-warm/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="/tmp/godot-warm.apk"
          script_export_mode=2
          [preset.0.options]
          gradle_build/use_gradle_build=true
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=true
          gradle_build/export_format=0
          gradle_build/min_sdk="29"
          gradle_build/target_sdk="35"
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.xrealcanvas.toolchainwarmup"
          package/name="Scottish Targe Toolchain Warmup"
          package/signed=true
          xr_features/xr_mode=0
          EOF
          godot --headless --path /tmp/godot-warm --install-android-build-template --export-debug Android /tmp/godot-warm.apk
          test -s /tmp/godot-warm.apk

      - name: Download pinned godot-xreal and Shizuku runtime jars
        run: |
          set -euxo pipefail
          mkdir -p /tmp/scottish-toolchain/public /tmp/scottish-toolchain/shizuku
          curl -L --retry 4 --fail -o /tmp/scottish-toolchain/public/godot-xreal-v1.2.4.zip \
            https://github.com/shiena/godot-xreal/releases/download/v1.2.4/godot-xreal-v1.2.4.zip
          curl -L --retry 4 --fail -o /tmp/scottish-toolchain/shizuku/api-13.1.5.aar \
            https://repo1.maven.org/maven2/dev/rikka/shizuku/api/13.1.5/api-13.1.5.aar
          curl -L --retry 4 --fail -o /tmp/scottish-toolchain/shizuku/provider-13.1.5.aar \
            https://repo1.maven.org/maven2/dev/rikka/shizuku/provider/13.1.5/provider-13.1.5.aar

      - name: Assemble offline toolchain bundle
        run: |
          set -euxo pipefail
          mkdir -p /tmp/scottish-toolchain/bin /tmp/scottish-toolchain/godot/export_templates/4.7.stable
          cp /usr/local/bin/godot /tmp/scottish-toolchain/bin/godot
          cp -a "$HOME/.local/share/godot/export_templates/4.7.stable/." /tmp/scottish-toolchain/godot/export_templates/4.7.stable/
          cp -a "$HOME/.gradle" /tmp/scottish-toolchain/gradle-home
          tar -C "$ANDROID_HOME" -czf /tmp/scottish-toolchain/android-sdk-35.tar.gz \
            platform-tools build-tools/35.0.1 platforms/android-35 cmdline-tools/latest licenses
          cp "$HOME/.config/godot/editor_settings-4.7.tres" /tmp/scottish-toolchain/editor_settings-4.7.tres
          printf 'Godot: '; /tmp/scottish-toolchain/bin/godot --version
          du -sh /tmp/scottish-toolchain/*

      - name: Upload offline toolchain
        uses: actions/upload-artifact@v4
        with:
          name: Scottish-Targe-Godot-Offline-Toolchain
          path: /tmp/scottish-toolchain
          compression-level: 0
          if-no-files-found: error
